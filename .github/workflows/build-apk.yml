name: Build APK (SDK 35)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout codigo
        uses: actions/checkout@v5

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Instalar Android SDK 35
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 📚 Instalar dependencias Capacitor
        run: npm install

      - name: 🔧 Inicializar Capacitor
        run: |
          npx cap init "Mahjong World Tour" "com.artjmarcos.mahjongtour" --web-dir=.
          npx cap add android || true

      - name: ⚙️ Forzar targetSdkVersion 35 en build.gradle
        run: |
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/g' android/app/build.gradle || true

      - name: 🔐 Usar keystore existente si existe
        run: |
          if [ -f signing.keystore ]; then
            cp signing.keystore android/app/release.keystore
            echo "Se usará el keystore existente del repositorio."
          else
            echo "No existe signing.keystore en la raíz; se generará uno nuevo."
          fi

      - name: 🔑 Generar keystore de release solo si no existe
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore android/app/release.keystore \
              -alias my-key-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass kAH0EIZmWrh_ \
              -keypass kAH0EIZmWrh_ \
              -dname "CN=Mahjong Tour Admin, OU=Engineering, O=Mahjong World Tour · Viaja por el mundo, L=Santiago, ST=Santiago, C=US"
          fi

      - name: ⚙️ Configurar Gradle signing (asegurar valores mínimos)
        run: |
          mkdir -p android/app
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.artjmarcos.mahjongtour'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.artjmarcos.mahjongtour'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'kAH0EIZmWrh_'
                      keyAlias 'my-key-alias'
                      keyPassword 'kAH0EIZmWrh_'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 🏗️ Compilar APK release con SDK 35
        working-directory: android
        run: ./gradlew assembleRelease

      - name: 📤 Subir APK release
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-world-tour-sdk35
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 🔐 Subir keystore
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-keystore
          path: android/app/release.keystore
          retention-days: 90
